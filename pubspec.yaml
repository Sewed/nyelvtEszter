name: nyelvtanulo
description: "Német nyelvtanuló alkalmazás szókártyákkal, kvízzel és szótárral."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  confetti: ^0.8.0
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/szavak.json
    - assets/icon/app_icon.png
    - assets/tts/model.onnx
    - assets/tts/tokens.txt
    - assets/tts/espeak-ng-data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21